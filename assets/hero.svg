<svg xmlns="http://www.w3.org/2000/svg" width="467" height="150" viewBox="0 0 467 150" role="img" aria-label="Mostafa Sholkamy — Flutter &amp; Front-End Developer" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif">
<rect x="0.5" y="0.5" width="466" height="149" rx="8" fill="#1a1b26" stroke="#2f314d"/>
<style>
  @keyframes rise {
    0%   { opacity: 1; transform: translateY(0); }
    32%  { opacity: 1; transform: translateY(0); }
    40%  { opacity: 0; transform: translateY(-12px); }
    100% { opacity: 0; transform: translateY(-12px); }
  }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .ln  { animation: rise 10s cubic-bezier(.4,0,.2,1) infinite; }
  .crt { animation: blink 1.1s steps(1,end) infinite; }
  .l1 { animation-delay: 0s; }
  .l2 { animation-delay: 3.34s; }
  .l3 { animation-delay: 6.68s; }
  @media (prefers-reduced-motion: reduce) {
    .ln  { animation: none; }
    .crt { animation: none; }
  }
</style>
<g class="ln l1"><rect class="crt" x="0" y="21" width="9" height="21" rx="1.5" fill="#7aa2f7"/><text x="26" y="40" font-size="27" font-weight="700" fill="#c8d3f5">Hi, I'm Mostafa Sholkamy</text></g>
<g class="ln l2" opacity="0"><rect class="crt" x="0" y="55" width="9" height="21" rx="1.5" fill="#7aa2f7"/><text x="26" y="74" font-size="27" font-weight="700" fill="#7aa2f7">Flutter &amp; Front-End Developer</text></g>
<g class="ln l3" opacity="0"><rect class="crt" x="0" y="89" width="9" height="21" rx="1.5" fill="#7aa2f7"/><text x="26" y="108" font-size="27" font-weight="700" fill="#2ac3de">Building clean &amp; scalable apps</text></g>
<rect x="20" y="120" width="427" height="1" fill="#2f314d"/>
<text x="20" y="137" font-size="12.5" fill="#7a83b2">Engineering &amp; CS Student  ·  Cairo, Egypt  ·  Open to Flutter roles</text>
</svg>
